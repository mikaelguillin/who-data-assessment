[project]
name = "who-data-assessment"
version = "0.1.0"
description = "Prototype for ingesting, harmonising, and classifying multi-country health expenditure extracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pydantic>=2.11.0",
    "sqlmodel>=0.0.24",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
]

[project.scripts]
ingest = "pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.fastapi]
entrypoint = "api.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
